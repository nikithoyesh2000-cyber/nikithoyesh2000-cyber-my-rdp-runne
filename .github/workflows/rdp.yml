name: Windows RDP Runner

on:
  repository_dispatch:
    types: [start-rdp]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Create RDP User
        run: |
          net user RDPUser "Pass2026RDP#!" /add
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"

      - name: Start Pinggy Tunnel & Display Info
        run: |
          # Start SSH process in background and redirect output to a log file
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log" -NoNewWindow

          Write-Host "Waiting for Pinggy RDP Tunnel URL..."
          Start-Sleep -Seconds 15

          # Read logs from output file
          if (Test-Path "pinggy.log") {
              $logs = Get-Content "pinggy.log"
              Write-Host "--- Raw Pinggy Log ---"
              Write-Host ($logs -join "`n")

              $urlMatch = $logs | Select-String -Pattern '([a-zA-Z0-9-]+\.pinggy\.link:[0-9]+)'
              if ($urlMatch) {
                  $RdpAddress = $urlMatch.Matches[0].Value
                  Write-Host "============================================="
                  Write-Host "🚀 RDP Address : $RdpAddress"
                  Write-Host "👤 Username    : RDPUser"
                  Write-Host "🔑 Password    : Pass2026RDP#!"
                  Write-Host "============================================="
              }
          }

      - name: Keep Runner Alive
        run: |
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "RDP Active... ($i mins elapsed)"
          }
