name: Windows RDP Runner

on:
  repository_dispatch:
    types: [start-rdp]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Install Ngrok
        run: |
          choco install ngrok -y

      - name: Authenticate Ngrok
        run: |
          ngrok authtoken ${{ github.event.client_payload.ngrok_token }}

      - name: Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Create RDP User Password
        run: |
          net user RDPUser "Pass2026RDP#!" /add
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"

      - name: Start Ngrok Tunnel & Display Connection Info
        run: |
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389 --log=stdout"
          
          # Ngrok API එක ready වන තෙක් තත්පර 15ක් දක්වා බල සිටීම
          $retries = 0
          $Response = $null
          while ($retries -lt 15 -and $Response -eq $null) {
              Start-Sleep -Seconds 2
              try {
                  $Response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
              } catch {
                  $retries++
                  Write-Host "Waiting for Ngrok API to start... ($retries/15)"
              }
          }

          if ($Response -and $Response.tunnels.Count -gt 0) {
              $PublicUrl = $Response.tunnels[0].public_url
              Write-Host "============================================="
              Write-Host "🚀 RDP Address : $PublicUrl"
              Write-Host "👤 Username    : RDPUser"
              Write-Host "🔑 Password    : Pass2026RDP#!"
              Write-Host "============================================="
          } else {
              Write-Error "Failed to retrieve Ngrok Public URL"
              exit 1
          }

      - name: Keep Runner Alive
        run: |
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "RDP Active... ($i mins elapsed)"
          }
