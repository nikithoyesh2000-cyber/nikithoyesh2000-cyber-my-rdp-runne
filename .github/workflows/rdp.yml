name: Windows RDP Runner

on:
  repository_dispatch:
    types: [start-rdp]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Install Ngrok
        run: |
          choco install ngrok -y

      - name: Authenticate Ngrok
        run: |
          ngrok authtoken ${{ github.event.client_payload.ngrok_token }}

      - name: Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Create RDP User Password
        run: |
          net user RDPUser "P@ssw0rd2026RDP#!" /add
          net localgroup "Remote Desktop Users" RDPUser /add
          net localgroup "Administrators" RDPUser /add

      - name: Start Ngrok Tunnel & Display Connection Info
        run: |
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 10
          $Response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
          $PublicUrl = $Response.tunnels[0].public_url
          Write-Host "============================================="
          Write-Host "🚀 RDP Address : $PublicUrl"
          Write-Host "👤 Username    : RDPUser"
          Write-Host "🔑 Password    : P@ssw0rd2026RDP#!"
          Write-Host "============================================="

      - name: Keep Runner Alive
        run: |
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "RDP Active... ($i mins elapsed)"
          }
