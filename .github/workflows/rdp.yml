name: Windows RDP Runner

on:
  repository_dispatch:
    types: [start-rdp]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable RDP, Services & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService" -ErrorAction SilentlyContinue
          Set-Service -Name "UmRdpService" -StartupType Automatic
          Start-Service -Name "UmRdpService" -ErrorAction SilentlyContinue
          
          New-NetFirewallRule -DisplayName "Allow RDP Port 3389" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

      - name: Create RDP User
        run: |
          net user RDPUser "Pass2026RDP#!" /add
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"

      - name: Start Serveo TCP Tunnel
        run: |
          # SSH connection via Serveo forwarding port 3389
          Start-Process -FilePath "ssh" -ArgumentList "-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:3389 serveo.net" -RedirectStandardOutput "serveo.log" -RedirectStandardError "serveo_err.log" -NoNewWindow
          
          Start-Sleep -Seconds 10

          $logs = @()
          if (Test-Path "serveo.log") { $logs += Get-Content "serveo.log" }
          if (Test-Path "serveo_err.log") { $logs += Get-Content "serveo_err.log" }

          # Match serveo address format (e.g., serveo.net:12345 or tcp.serveo.net:12345)
          $portMatch = $logs | Select-String -Pattern 'Forwarding TCP traffic from (.*:[0-9]+)'
          
          if ($portMatch) {
              $RdpAddress = $portMatch.Matches[0].Groups[1].Value
              Write-Host "============================================="
              Write-Host "🚀 RDP Address : $RdpAddress"
              Write-Host "👤 Username    : RDPUser"
              Write-Host "🔑 Password    : Pass2026RDP#!"
              Write-Host "============================================="
          } else {
              Write-Host "--- Raw Serveo Log ---"
              Write-Host ($logs -join "`n")
          }

      - name: Keep Runner Alive
        run: |
          $i = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "RDP Active... ($i mins elapsed)"
          }
