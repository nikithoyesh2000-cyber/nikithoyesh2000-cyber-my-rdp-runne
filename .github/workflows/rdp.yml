name: Windows RDP Runner

on:
  repository_dispatch:
    types: [start-rdp]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Create RDP User
        run: |
          net user RDPUser "Pass2026RDP#!" /add
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDPUser"
          Add-LocalGroupMember -Group "Administrators" -Member "RDPUser"

      - name: Start Pinggy Tunnel
        run: |
          Write-Host "============================================="
          Write-Host "👤 Username : RDPUser"
          Write-Host "🔑 Password : Pass2026RDP#!"
          Write-Host "============================================="
          ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 tcp@a.pinggy.io
